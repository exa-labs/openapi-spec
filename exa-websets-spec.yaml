          type: string
          minLength: 2
          maxLength: 200
      required:
        - type
        - description
      title: Custom
    CreateCriterionParameters:
      type: object
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 1000
          description: The description of the criterion
      required:
        - description
    WebsetEnrichmentFormat:
      type: string
      enum:
        - text
        - date
        - number
        - options
        - email
        - phone
        - url
    CreateEnrichmentParameters:
      type: object
