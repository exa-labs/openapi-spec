info:
  title: Websets
  description: ""
  version: "0"
  contact: {}
tags: []
servers:
  - url: https://api.exa.ai/websets/
    description: Production
components:
  schemas:
    CreateWebsetParameters:
      type: object
      properties:
        title:
          description: Optional name that appears anywhere the Webset is displayed. Leave empty to have Exa generate one automatically.
          examples:
            - Leading climate tech startups
          anyOf:
            - type: string
              minLength: 1
            - type: "null"
        search:
          type: object
          properties:
            query:
              type: string
              minLength: 1
              maxLength: 5000
              description: |-
                Natural language search query describing what you are looking for.

                Be specific and descriptive about your requirements, characteristics, and any constraints that help narrow down the results.

                Any URLs provided will be crawled and used as additional context for the search.
              examples:
                - Marketing agencies based in the US, that focus on consumer products.
                - AI startups in Europe that raised Series A funding in 2024
                - SaaS companies with 50-200 employees in the fintech space
            count:
              default: 10
              description: |-
                Number of Items the Webset will attempt to find.

                The actual number of Items found may be less than this number depending on the search complexity.
              type: number
              minimum: 1
            entity:
              description: Entity the Webset returns results for. Detected from the query when omitted.
              $ref: "#/components/schemas/Entity"
            criteria:
              description: Criteria every Item is evaluated against. Generated from the query when omitted.
              minItems: 1
              maxItems: 5
              type: array
              items:
                title: CreateCriterionParameters
                $ref: "#/components/schemas/CreateCriterionParameters"
            maxPeoplePerCompany:
              description: Optional soft cap for people searches. When set, the search will try to include at most this many matching people from the same current employer company.
              type: integer
              minimum: 1
            recall:
              description: Whether to estimate how many relevant results exist for this search. The estimate is returned in the search's `recall` field.
              type: boolean
            exclude:
              description: Imports or Websets whose items are left out of this search's results.
              type: array
              items:
                type: object
                properties:
                  source:
                    type: string
                    enum:
                      - import
                      - webset
                  id:
                    type: string
                    minLength: 1
                    description: The ID of the source to exclude.
                required:
                  - source
                  - id
            scope:
              description: Limit the search to specific sources (existing imports or websets). Any results found within these sources matching the search criteria will be included in the Webset.
              type: array
              items:
                type: object
                properties:
                  source:
                    type: string
                    enum:
                      - import
                      - webset
                  id:
                    type: string
                    minLength: 1
                    description: The ID of the source to search.
                  relationship:
                    type: object
                    properties:
                      definition:
                        type: string
                        description: What the relationship of the entities you hope to find is relative to the entities contained in the provided source.
                      limit:
                        type: number
                        minimum: 1
                        maximum: 10
                    required:
                      - definition
                      - limit
                required:
                  - source
                  - id
          required:
            - query
          description: Create initial search for the Webset.
        import:
          description: Import data from existing Websets and Imports into this Webset.
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                enum:
                  - import
                  - webset
              id:
                type: string
                minLength: 1
                description: The ID of the source to import.
              evaluate:
                description: When true, items from this import will be evaluated against the search criteria. Requires a search to be provided.
                type: boolean
            required:
              - source
              - id
        enrichments:
          description: Enrichments that extract additional data from each Item added to the Webset.
          type: array
          items:
            title: CreateEnrichmentParameters
            $ref: "#/components/schemas/CreateEnrichmentParameters"
        exclude:
          description: Global exclusion sources (existing imports or websets) that apply to all operations within this Webset. Any results found within these sources will be omitted across all search and import operations.
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                enum:
                  - import
                  - webset
              id:
                type: string
                minLength: 1
                description: The ID of the source to exclude.
            required:
              - source
              - id
        externalId:
          description: |-
            The external identifier for the webset.

            You can use this to reference the Webset by your own internal identifiers.
          type: string
          maxLength: 300
        metadata:
          description: Set of key-value pairs you want to associate with this object.
          type: object
          propertyNames:
            type: string
            maxLength: 250
          additionalProperties:
            type: string
            maxLength: 1000
      examples:
        - search:
            query: Marketing agencies based in the US, that focus on consumer products.
            count: 10
    Entity:
      oneOf:
        - $ref: "#/components/schemas/CompanyEntity"
        - $ref: "#/components/schemas/PersonEntity"
        - $ref: "#/components/schemas/ArticleEntity"
        - $ref: "#/components/schemas/ResearchPaperEntity"
        - $ref: "#/components/schemas/CustomEntity"
    CompanyEntity:
      type: object
      properties:
        type:
          type: string
          const: company
          default: company
      required:
        - type
      title: Company
    PersonEntity:
      type: object
      properties:
        type:
          type: string
          const: person
          default: person
      required:
        - type
      title: Person
    ArticleEntity:
      type: object
      properties:
        type:
          type: string
          const: article
          default: article
      required:
        - type
      title: Article
    ResearchPaperEntity:
      type: object
      properties:
