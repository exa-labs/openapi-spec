openapi: 3.1.0
paths:
  /v0/websets:
    post:
      operationId: websets-create
      summary: Create a Webset
      description: |-
        Creates a new Webset with optional search, import, and enrichment configurations. The Webset will automatically begin processing once created.

        You can specify an `externalId` to reference the Webset with your own identifiers for easier integration.
      tags:
        - Websets
      security:
        - api_key: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWebsetParameters"
      responses:
        "201":
          description: Webset created
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique identifier for the request.
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webset"
        "409":
          description: Webset with this externalId already exists
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique identifier for the request.
              required: true
      x-codeSamples:
        - lang: javascript
          label: JavaScript
          source: |-
            // npm install exa-js
            import Exa from "exa-js";
            const exa = new Exa("YOUR_EXA_API_KEY");

            const webset = await exa.websets.create({
              search: {
                query: "Tech companies in San Francisco",
                count: 10,
              },
            });

            console.log(`Created webset: ${webset.id}`);
        - lang: python
          label: Python
          source: |-
            # pip install exa-py
            from exa_py import Exa

            exa = Exa("YOUR_EXA_API_KEY")

            webset = exa.websets.create(
                params={"search": {"query": "Tech companies in San Francisco", "count": 10}}
            )

            print(f"Created webset: {webset.id}")
    get:
      operationId: websets-list
      summary: List all Websets
      description: |-
        Returns a list of Websets.

        You can paginate through the results using the `cursor` parameter.

        You can filter results using the `search` parameter to find Websets by ID, external ID, or title.
      tags:
        - Websets
      security:
        - api_key: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
            minLength: 1
          required: false
          description: The cursor to paginate through the results
        - in: query
          name: limit
          schema:
            default: 25
            type: number
            minimum: 1
            maximum: 100
          required: false
          description: The number of Websets to return
        - in: query
          name: search
          schema:
            type: string
            minLength: 2
            maxLength: 50
          required: false
          description: Search term to filter Websets by ID, external ID, or title
      responses:
        "200":
          description: List of Websets
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique identifier for the request.
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListWebsetsResponse"
      x-codeSamples:
        - lang: javascript
          label: JavaScript
          source: |-
            // npm install exa-js
            import Exa from "exa-js";
            const exa = new Exa("YOUR_EXA_API_KEY");

            // List websets with optional pagination
            const websets = await exa.websets.list({
              limit: 20, // Optional: max results per page
            });

            console.log(`Found ${websets.data.length} websets`);
            websets.data.forEach((webset) => {
              console.log(`- ${webset.id}: ${webset.status}`);
            });
        - lang: python
          label: Python
          source: |-
            # pip install exa-py
            from exa_py import Exa

            exa = Exa("YOUR_EXA_API_KEY")

            # List websets with optional pagination
            websets_response = exa.websets.list(
                limit=20  # Optional: max results per page
            )

            print(f"Found {len(websets_response.data)} websets")
            for webset in websets_response.data:
                print(f"- {webset.id}: {webset.status}")
  /v0/websets/{id}:
    get:
      operationId: websets-get
      summary: Get a Webset
      description: |-
        Returns a Webset by `id` or `externalId`, including its status, searches, imports, enrichments, and monitors.

        Pass `expand=items` to include up to the first 100 items in the response.
      tags:
        - Websets
      security:
        - api_key: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: The id or externalId of the Webset.
          required: true
        - in: query
          name: expand
          schema:
            type: array
            items:
              type: string
              enum:
                - items
          required: false
          description: Expand the response with the specified resources
      responses:
        "200":
          description: Webset
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique identifier for the request.
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetWebsetResponse"
        "404":
          description: Webset not found
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique identifier for the request.
              required: true
      x-codeSamples:
        - lang: javascript
          label: JavaScript
          source: |-
            // npm install exa-js
            import Exa from "exa-js";
            const exa = new Exa("YOUR_EXA_API_KEY");

            const webset = await exa.websets.get("webset_id");

            console.log(`Webset: ${webset.id} - ${webset.status}`);
        - lang: python
          label: Python
          source: |-
            # pip install exa-py
            from exa_py import Exa

            exa = Exa("YOUR_EXA_API_KEY")

            webset = exa.websets.get("webset_id")

            print(f"Webset: {webset.id} - {webset.status}")
    post:
      operationId: websets-update
      summary: Update a Webset
      description: Updates the `title` or `metadata` of a Webset. Searches, imports, and enrichments are managed through their own endpoints.
      tags:
        - Websets
      security:
        - api_key: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: The id or externalId of the Webset
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWebsetRequest"
      responses:
        "200":
          description: Webset updated
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique identifier for the request.
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webset"
        "404":
          description: Webset not found
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique identifier for the request.
              required: true
      x-codeSamples:
        - lang: javascript
          label: JavaScript
          source: |-
            // npm install exa-js
            import Exa from "exa-js";
            const exa = new Exa("YOUR_EXA_API_KEY");

            const webset = await exa.websets.update("webset_id", {
              name: "Updated Webset Name",
              description: "Updated description",
            });

            console.log(`Updated webset: ${webset.id}`);
        - lang: python
          label: Python
          source: |-
            # pip install exa-py
            from exa_py import Exa

            exa = Exa("YOUR_EXA_API_KEY")

            webset = exa.websets.update(
                "webset_id",
                params={"name": "Updated Webset Name", "description": "Updated description"},
            )

            print(f"Updated webset: {webset.id}")
    delete:
      operationId: websets-delete
      summary: Delete a Webset
      description: |-
        Deletes a Webset.

        Once deleted, the Webset and all its Items will no longer be available.
      tags:
        - Websets
      security:
        - api_key: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: The id or externalId of the Webset
          required: true
      responses:
        "200":
          description: Webset deleted
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique identifier for the request.
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webset"
        "404":
          description: Webset not found
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique identifier for the request.
              required: true
      x-codeSamples:
        - lang: javascript
          label: JavaScript
          source: |-
            // npm install exa-js
            import Exa from "exa-js";
            const exa = new Exa("YOUR_EXA_API_KEY");

            await exa.websets.delete("webset_id");

            console.log("Webset deleted successfully");
        - lang: python
          label: Python
          source: |-
            # pip install exa-py
            from exa_py import Exa

            exa = Exa("YOUR_EXA_API_KEY")

            exa.websets.delete("webset_id")

            print("Webset deleted successfully")
  /v0/websets/{id}/cancel:
    post:
      operationId: websets-cancel
      summary: Cancel a running Webset
      description: |-
        Cancels all operations being performed on a Webset.

        Any enrichment or search will be stopped and the Webset will be marked as `idle`.
      tags:
        - Websets
      security:
        - api_key: []
      parameters:
        - in: path
          name: id
          schema:
            type: string
          description: The id or externalId of the Webset
          required: true
      responses:
        "200":
          description: Webset canceled
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Unique identifier for the request.
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webset"
