          items:
            type: object
            properties:
              label:
                type: string
                description: The label of the option
            required:
              - label
        metadata:
          description: Set of key-value pairs you want to associate with this object.
          type: object
          propertyNames:
            type: string
            maxLength: 250
          additionalProperties:
            type: string
            maxLength: 1000
      required:
        - description
    UpdateWebsetRequest:
      type: object
      properties:
        metadata:
          description: Set of key-value pairs you want to associate with this object.
          anyOf:
            - type: object
              propertyNames:
                type: string
                maxLength: 250
              additionalProperties:
                type: string
                maxLength: 1000
            - type: "null"
        title:
          description: Optional name that appears anywhere the Webset is displayed.
          examples:
            - Leading climate tech startups
          type: string
          minLength: 1
    CreateWebsetSearchParameters:
      type: object
      properties:
        count:
          type: number
          minimum: 1
          description: |-
            Number of Items the Search will attempt to find.

            The actual number of Items found may be less than this number depending on the query complexity.
        query:
          type: string
          minLength: 1
          maxLength: 5000
          description: |-
            Natural language search query describing what you are looking for.

            Be specific and descriptive about your requirements, characteristics, and any constraints that help narrow down the results.

            Any URLs provided will be crawled and used as additional context for the search.
          examples:
            - Marketing agencies based in the US, that focus on consumer products. Get brands worked with and city
            - AI startups in Europe that raised Series A funding in 2024
            - SaaS companies with 50-200 employees in the fintech space
        entity:
          description: Entity the search returns results for. Detected from the query when omitted.
          $ref: "#/components/schemas/Entity"
        criteria:
          description: Criteria every Item is evaluated against. Generated from the query when omitted.
          minItems: 1
          maxItems: 5
          type: array
          items:
            title: CreateCriterionParameters
            $ref: "#/components/schemas/CreateCriterionParameters"
        maxPeoplePerCompany:
          description: Optional soft cap for people searches. When set, the search will try to include at most this many matching people from the same current employer company.
          type: integer
          minimum: 1
        exclude:
          description: Imports or Websets whose items are left out of this search's results.
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                enum:
                  - import
                  - webset
              id:
                type: string
                minLength: 1
                description: The ID of the source to exclude.
            required:
              - source
              - id
        scope:
          description: Limit the search to specific sources (existing imports). Any results found within these sources matching the search criteria will be included in the Webset.
          type: array
          items:
            type: object
            properties:
              source:
                type: string
                enum:
                  - import
                  - webset
              id:
                type: string
                minLength: 1
                description: The ID of the source to search.
              relationship:
                type: object
                properties:
                  definition:
                    type: string
                    description: What the relationship of the entities you hope to find is relative to the entities contained in the provided source.
                  limit:
                    type: number
                    minimum: 1
                    maximum: 10
                required:
                  - definition
                  - limit
            required:
              - source
              - id
        recall:
          description: Whether to estimate how many relevant results exist for this search. The estimate is returned in the search's `recall` field.
          type: boolean
        behavior:
          default: override
          description: |-
            How this search interacts with existing items in the Webset:

            - **override**: Replace existing items and evaluate all items against new criteria
            - **append**: Add new items to existing ones, keeping items that match the new criteria
          $ref: "#/components/schemas/WebsetSearchBehavior"
        metadata:
          description: Set of key-value pairs you want to associate with this object.
          type: object
          propertyNames:
            type: string
